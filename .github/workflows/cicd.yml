name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CoffeeNChill.Functions/CoffeeNChill_Functions.csproj

      - name: Build
        run: dotnet build CoffeeNChill.Functions/CoffeeNChill_Functions.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test CoffeeNChill.Functions.Tests/CoffeeNChill.Functions.Tests.csproj --configuration Release

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./CoffeeNChill.Functions
          push: true
          tags: |
            sonaliarjun/coffeenchill-functions:latest
            sonaliarjun/coffeenchill-functions:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/cldv6212-cicd-deployment
            docker-compose pull
            docker-compose up -d